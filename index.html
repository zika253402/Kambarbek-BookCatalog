<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <img src="img/TheSongOfAchilles.jpg" alt="The Song of Achilles" class="card-image">
        <h2 class="card-title">The Song of Achilles</h2>
        <p class="card-price">$14.99</p>
        <p class="card-author">by Madeline Miller</p>
        <p class="card-description">A retelling of the Iliad from the perspective of Patroclus, exploring his
            relationship with Achilles.</p>
        <button class="card-button">Add to Cart</button>
    </div>
</body>

</html>
